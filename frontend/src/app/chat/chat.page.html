<ion-footer [translucent]="true">
  <form (submit)="onSubmitMensaje($event, afterChat)">
    <ion-toolbar>
        <ion-input 
          name="entrada" 
          placeholder="escriba aqui" 
          [(ngModel)]="entradaUsuario"
          [readonly]="estaEnviandoMensaje ? true : null"
          #entradaMensaje
        ></ion-input>

        <ion-buttons slot="end">
          <ion-button type="submit">enviar</ion-button>
        </ion-buttons>
    </ion-toolbar>
  </form>
</ion-footer>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <ion-list style="message-list">
        @for (
          mensaje of mensajesChat; 
          track [mensaje.hora, mensaje.autor]; 
          let is_last= $last
        ) {
          <ion-item class="autor-{{mensaje.autor}}" [attr.autofocus]="is_last ? true : null">
          <ion-card>
            <ion-card-header>
              <ion-card-title> {{ mensaje.autor == "chatbot" ? "chatbot" : "tu"}} </ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <p> {{mensaje.contenido}} </p><br>
              <p> {{mensaje.hora.toLocaleString()}} </p>
            </ion-card-content>
          </ion-card>
          </ion-item>
        }
      </ion-list>
      <a #afterChat id="afterChat"></a>
    </ion-card-content>
  </ion-card>
</ion-content>
