[project]
name = "ttps-chatbot"
version = "0.1.0"
description = ""
authors = [
    {name = "Nicolás Rodrigo Citro",email = "nicolasrodrigocitro@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "pypdf (>=6.1.1,<7.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pymupdf (>=1.26.4,<2.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "twilio (>=8.0.0)",
    "httpx (>=0.24.0)",
    "openai (==0.28.0)",
    "phonenumbers (>=9.0.19,<10.0.0)",
    "flask-sqlalchemy-lite (>=0.2.1,<0.3.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pymupdf4llm (>=0.3.4,<0.4.0)",
    "qdrant-client (>=1.17.0,<2.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "torch (>=2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ttps-chatbot"
version = "0.1.0"
package-mode = false

# ==============================================================================
# CONFIGURACIÓN DE PYTORCH: MODO CPU (POR DEFECTO) VS GPU (NVIDIA CUDA)
# Evita descargar ~8 GB de librerías NVIDIA/CUDA en entornos sin GPU dedicada.
#
# Si el servidor de despliegue cuenta con GPU NVIDIA y CUDA:
#   1. Comentar las secciones [tool.poetry.dependencies] y [[tool.poetry.source]] de abajo.
#   2. Regenerar el lockfile: poetry lock
#   3. Reconstruir contenedores: docker compose up -d --build
# ==============================================================================
[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"